name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'gemini/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CAMELLIA_REMOTE_DOCS_HOME_URL: ${{ github.server_url }}/${{ github.repository }}
  CAMELLIA_REMOTE_LINUX_DISPLAY_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/platform-notes.md#linux-display-requirements
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.44.9"
  COCOAPODS_VERSION: "1.17.0"
  NODE_VERSION: "24.22.1"
  DEPENDENCY_MODE: locked

jobs:
  metadata:
    name: Validate component version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and validate release metadata
        id: release
        run: |
          python3 .github/scripts/tests/test_release_metadata.py
          python3 .github/scripts/release_metadata.py --github-output

      - name: Resolve reproducible source timestamp
        id: source
        shell: bash
        run: echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  generate_bridge:
    name: Generate Flutter Rust bridge
    needs: [metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - name: Generate bridge
        run: bash .github/scripts/generate-bridge.sh

      - name: Format generated Rust bridge
        run: cargo fmt --all

      - name: Upload generated bridge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: |
            src/bridge_generated*.rs
            flutter/lib/generated_bridge*.dart
            flutter/lib/generated_bridge/**
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Rust, Flutter, and Web quality
    needs: [metadata, generate_bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download generated bridge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: .

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flutter/web/js/package-lock.json

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - name: Bootstrap verified Web codec assets
        run: bash flutter/web/tools/prepare_web_deps.sh

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --locked --workspace --all-targets --features flutter

      - name: Rust tests
        run: cargo test --locked --workspace --features flutter

      - name: Flutter analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Web bridge lint
        working-directory: flutter/web/js
        run: npm run lint

      - name: Web bridge build
        working-directory: flutter/web/js
        run: npm run build

  build_client:
    name: Build Linux Client
    needs: [metadata, generate_bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download generated bridge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: .

      - name: Install Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-unknown-linux-gnu

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          doNotCache: true
          vcpkgDirectory: ${{ runner.temp }}/vcpkg

      - name: Compile and package Linux client
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-linux --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release --target x86_64-unknown-linux-gnu --lib --features flutter,hwcodec,unix-file-copy-paste
          mkdir -p target/release
          cp target/x86_64-unknown-linux-gnu/release/libcamellia_remote.so target/release/libcamellia_remote.so
          (cd flutter && flutter build linux --release)
          mkdir -p artifacts/camellia-remote-${{ needs.metadata.outputs.version }}-linux-x64
          cp -R flutter/build/linux/*/release/bundle/* artifacts/camellia-remote-${{ needs.metadata.outputs.version }}-linux-x64/
          tar -C artifacts -czf artifacts/camellia-remote-${{ needs.metadata.outputs.version }}-linux-x64.tar.gz camellia-remote-${{ needs.metadata.outputs.version }}-linux-x64
          rm -rf artifacts/camellia-remote-${{ needs.metadata.outputs.version }}-linux-x64
          bash .github/scripts/package-linux.sh \
            "${{ needs.metadata.outputs.version }}" \
            "x64" \
            "amd64" \
            "x86_64"

      - name: Upload client release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: camellia-remote-client-linux-x64-${{ github.sha }}
          path: |
            artifacts/*.tar.gz
            artifacts/*.deb
            artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 14

  required:
    name: CI / Required
    if: always()
    needs:
      - metadata
      - generate_bridge
      - quality
      - build_client
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          BRIDGE_RESULT: ${{ needs.generate_bridge.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build_client.result }}
        run: |
          [[ "$METADATA_RESULT" == success ]] || { echo "Metadata must succeed, got: $METADATA_RESULT" >&2; exit 1; }
          [[ "$BRIDGE_RESULT" == success ]] || { echo "Bridge generation must succeed, got: $BRIDGE_RESULT" >&2; exit 1; }
          [[ "$QUALITY_RESULT" == success ]] || { echo "Quality must succeed, got: $QUALITY_RESULT" >&2; exit 1; }
          [[ "$BUILD_RESULT" == success ]] || { echo "Build client must succeed, got: $BUILD_RESULT" >&2; exit 1; }
