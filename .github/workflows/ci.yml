name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'
      - 'gemini/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CAMELLIA_REMOTE_DOCS_HOME_URL: ${{ github.server_url }}/${{ github.repository }}
  CAMELLIA_REMOTE_LINUX_DISPLAY_DOCS_URL: ${{ github.server_url }}/${{ github.repository }}/blob/main/docs/platform-notes.md#linux-display-requirements
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"
  FLUTTER_CHANNEL: stable
  FLUTTER_VERSION: "3.44.9"
  COCOAPODS_VERSION: "1.17.0"
  NODE_VERSION: "24.22.1"
  DEPENDENCY_MODE: locked

jobs:
  metadata:
    name: Validate component version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      app_version: ${{ steps.release.outputs.app_version }}
      build_number: ${{ steps.release.outputs.build_number }}
      tag: ${{ steps.release.outputs.tag }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and validate release metadata
        id: release
        run: |
          python3 .github/scripts/tests/test_release_metadata.py
          python3 .github/scripts/release_metadata.py --github-output

      - name: Test and validate source provenance
        run: |
          python3 .github/scripts/tests/test_source_provenance.py
          python3 .github/scripts/validate_source_provenance.py --component camellia-remote-client

      - name: Resolve reproducible source timestamp
        id: source
        shell: bash
        run: echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

  automation:
    name: Workflow and build automation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint workflows and shell scripts
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          shellcheck \
            .github/actions/setup-flutter/*.sh \
            .github/scripts/*.sh \
            .github/scripts/tests/*.sh \
            flutter/web/tools/build_web.sh

  generate_bridge:
    name: Generate Flutter Rust bridge
    needs: [metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Linux prerequisites
        run: |
          sudo bash -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf; echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
          echo 'Acquire::Force-IPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          echo 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-timeouts >/dev/null
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-timeouts >/dev/null
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          sudo -E apt-get update
          sudo -E apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - name: Generate bridge
        run: bash .github/scripts/generate-bridge.sh

      - name: Format generated Rust bridge
        run: cargo fmt --all

      - name: Verify zero bridge drift
        run: |
          git diff --exit-code -- \
            src/bridge_generated*.rs \
            flutter/lib/generated_bridge* \
            flutter/ios/Runner/bridge_generated.h \
            flutter/macos/Runner/bridge_generated.h

      - name: Upload generated bridge
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: |
            src/bridge_generated*.rs
            flutter/lib/generated_bridge*.dart
            flutter/lib/generated_bridge/**
            flutter/macos/Runner/bridge_generated.h
            flutter/ios/Runner/bridge_generated.h
          if-no-files-found: error
          retention-days: 14

  windows_rust:
    name: Windows Rust smoke check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Check Windows input implementation
        run: >-
          cargo check --locked -p enigo
          --target ${{ matrix.target }}
          --features with_serde

      - name: Check Windows session power adapter
        run: >-
          cargo check --locked -p camellia-platform-power
          --target ${{ matrix.target }}

      - name: Check Windows bootstrap boundary
        env:
          BOOTSTRAP_TARGET: ${{ matrix.target }}
        run: >-
          cargo clippy --locked -p camellia-windows-bootstrap --all-targets
          --target "$BOOTSTRAP_TARGET" -- -D warnings

      - name: Check Windows document-package print boundary
        env:
          PRINT_TARGET: ${{ matrix.target }}
        run: >-
          cargo clippy --locked -p camellia-printing --all-targets
          --target "$PRINT_TARGET" -- -D warnings

  windows_native:
    name: Windows native runner verification
    needs: [metadata, generate_bridge]
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download generated bridge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-native

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Configure vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: C:\vcpkg

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Synchronize declared version
        shell: bash
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        shell: bash
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - name: Install native vcpkg libraries
        shell: bash
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
          export SODIUM_LIB_DIR="$VCPKG_ROOT/installed/x64-windows-static/lib"
          echo "SODIUM_LIB_DIR=$SODIUM_LIB_DIR" >> "$GITHUB_ENV"
          "$VCPKG_ROOT/vcpkg" install --triplet arm64-windows-static --x-install-root="$RUNNER_TEMP/vcpkg-arm64"
          cp -r "$RUNNER_TEMP/vcpkg-arm64/arm64-windows-static" "$VCPKG_ROOT/installed/arm64-windows-static"

      - name: Check Windows Rust library
        shell: bash
        run: cargo check --locked --lib --features flutter,hwcodec,vram

      - name: Compile Windows native Rust library
        shell: bash
        run: cargo build --locked --release --lib --features flutter,hwcodec,vram

      - name: Build Flutter Windows runner
        shell: bash
        run: (cd flutter && flutter build windows --release)

      - name: Test Windows native bootstrap boundaries
        shell: bash
        run: cargo test --locked -p camellia-windows-bootstrap -- --nocapture

      - name: Test Windows native printing boundaries
        shell: bash
        run: cargo test --locked -p camellia-printing -- --nocapture

      - name: Check Windows aarch64 library compilation
        shell: bash
        env:
          SODIUM_LIB_DIR: C:\vcpkg\installed\arm64-windows-static\lib
        run: cargo check --locked --lib --features flutter,hwcodec,vram --target aarch64-pc-windows-msvc

      - name: Verify Windows aarch64 linkable compilation
        shell: pwsh
        env:
          SODIUM_LIB_DIR: C:\vcpkg\installed\arm64-windows-static\lib
        run: |
          python -m pip install --disable-pip-version-check -r libs/portable/requirements.txt
          $payload = Join-Path $env:RUNNER_TEMP 'camellia-portable-smoke-payload'
          New-Item -ItemType Directory -Force -Path $payload | Out-Null
          [System.IO.File]::WriteAllBytes(
            (Join-Path $payload 'camellia-remote.exe'),
            [byte[]](0x4d, 0x5a)
          )
          python libs/portable/generate.py `
            --folder $payload `
            --output libs/portable `
            --executable camellia-remote.exe `
            --target aarch64-pc-windows-msvc
          cargo build --locked --target aarch64-pc-windows-msvc --lib --features flutter

  apple_native:
    name: Apple native smoke checks
    needs: [metadata, generate_bridge]
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download generated bridge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-ios

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: apple-native

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flutter/web/js/package-lock.json

      - name: Install Apple build prerequisites
        run: bash .github/scripts/install-apple-prerequisites.sh

      - name: Configure vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgDirectory: ${{ runner.temp }}/vcpkg

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - name: Verify Apple Pod locks
        run: bash .github/scripts/verify-apple-pod-locks.sh ios macos

      - name: Check macOS input implementation
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p enigo --features with_serde

      - name: Check macOS session power adapter
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
          RUSTFLAGS: -D warnings
        run: cargo check --locked -p camellia-platform-power

      - name: Compile iOS Rust library
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: |
          "$VCPKG_ROOT/vcpkg" install \
            --triplet arm64-ios \
            --x-install-root="$VCPKG_ROOT/installed"
          cargo build --locked --release \
            --target aarch64-apple-ios \
            --lib \
            --features flutter

      - name: Compile unsigned iOS application
        working-directory: flutter
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "13.0"
        run: flutter build ipa --release --no-codesign

      - name: Reject Apple build source migrations
        if: always()
        run: bash .github/scripts/verify-clean-source.sh

  quality:
    name: Rust, Flutter, and Web quality
    needs: [metadata, generate_bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Download generated bridge
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bridge-generated-${{ github.sha }}
          path: .

      - name: Install Linux prerequisites
        run: |
          sudo bash -c 'echo "nameserver 8.8.8.8" > /etc/resolv.conf; echo "nameserver 1.1.1.1" >> /etc/resolv.conf'
          echo 'Acquire::Force-IPv4 "true";' | sudo tee /etc/apt/apt.conf.d/99force-ipv4 >/dev/null
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          echo 'Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/80-timeouts >/dev/null
          echo 'Acquire::https::Timeout "30";' | sudo tee -a /etc/apt/apt.conf.d/80-timeouts >/dev/null
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu/|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|azure\.archive\.ubuntu\.com|archive\.ubuntu\.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/*
          export DEBIAN_FRONTEND=noninteractive
          export NEEDRESTART_MODE=a
          sudo -E apt-get update
          sudo -E apt-get install -y \
            clang cmake curl gcc g++ git libasound2-dev libclang-dev libdbus-1-dev libglib2.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libgtk-3-dev libaom-dev libopus-dev \
            libpam0g-dev libpulse-dev libva-dev libx11-dev libxi-dev libxtst-dev libxcb-randr0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxdo-dev libxfixes-dev libvpx-dev libyuv-dev nasm ninja-build pkg-config unzip wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt,clippy

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install Flutter
        uses: ./.github/actions/setup-flutter
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: flutter/web/js/package-lock.json

      - name: Synchronize declared version
        run: |
          bash .github/scripts/sync-version.sh \
            "${{ needs.metadata.outputs.version }}" \
            "${{ needs.metadata.outputs.build_number }}" \
            "${{ needs.metadata.outputs.source_date_epoch }}"

      - name: Prepare locked dependencies
        run: bash .github/scripts/prepare-dependencies.sh "$DEPENDENCY_MODE"

      - name: Bootstrap verified Web codec assets
        run: bash flutter/web/tools/prepare_web_deps.sh

      - name: Rust format
        run: cargo fmt --all -- --check

      - name: Verify quality baselines (Rust Clippy)
        run: python3 .github/scripts/verify_quality_baselines.py --clippy

      - name: Rust tests
        run: cargo test --locked --workspace --features flutter

      - name: Verify quality baselines (Flutter analyze)
        run: python3 .github/scripts/verify_quality_baselines.py --flutter

      - name: Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Web bridge lint
        working-directory: flutter/web/js
        run: npm run lint

      - name: Web bridge build
        working-directory: flutter/web/js
        run: npm run build

  required:
    name: CI / Required
    if: always()
    needs:
      - metadata
      - automation
      - generate_bridge
      - windows_rust
      - windows_native
      - apple_native
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce required results
        shell: bash
        env:
          METADATA_RESULT: ${{ needs.metadata.result }}
          AUTOMATION_RESULT: ${{ needs.automation.result }}
          BRIDGE_RESULT: ${{ needs.generate_bridge.result }}
          WINDOWS_RUST_RESULT: ${{ needs.windows_rust.result }}
          WINDOWS_NATIVE_RESULT: ${{ needs.windows_native.result }}
          APPLE_NATIVE_RESULT: ${{ needs.apple_native.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          failure=false
          require_success() {
            local name="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "$name must succeed, got: $result" >&2
              failure=true
            fi
          }

          require_success "component version validation" "$METADATA_RESULT"
          require_success "workflow and build automation" "$AUTOMATION_RESULT"
          require_success "bridge generation" "$BRIDGE_RESULT"
          require_success "Windows Rust smoke check" "$WINDOWS_RUST_RESULT"
          require_success "Windows native runner verification" "$WINDOWS_NATIVE_RESULT"
          require_success "Apple native smoke checks" "$APPLE_NATIVE_RESULT"
          require_success "Rust, Flutter, and Web quality" "$QUALITY_RESULT"
          if [[ "$failure" == "true" ]]; then
            exit 1
          fi
