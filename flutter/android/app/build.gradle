import com.google.protobuf.gradle.*
import groovy.json.JsonSlurper
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id "com.google.protobuf" version "0.9.5"
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def ciSigningValues = [
    storeFile: System.getenv('CAMELLIA_ANDROID_STORE_FILE'),
    storePassword: System.getenv('ANDROID_KEY_STORE_PASSWORD'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD'),
    keyAlias: System.getenv('CAMELLIA_ANDROID_KEY_ALIAS'),
]
def ciSigningCount = ciSigningValues.values().count { value ->
    value != null && !value.trim().isEmpty()
}
if (ciSigningCount != 0 && ciSigningCount != ciSigningValues.size()) {
    throw new GradleException('The Camellia Android CI signing group must be configured completely')
}
def ciSigningConfigured = ciSigningCount == ciSigningValues.size()
def localSigningConfigured = keystoreProperties['storeFile'] != null
def formalRelease = System.getenv('CAMELLIA_FORMAL_RELEASE') == 'true'

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Add rustls-platform-verifier Android support
String findRustlsPlatformVerifierMavenDir() {
    def dependencyText = providers.exec {
        it.workingDir = new File("../..")
        commandLine("cargo", "metadata", "--format-version", "1")
    }.standardOutput.asText.get()

    def dependencyJson = new JsonSlurper().parseText(dependencyText)
    def pkg = dependencyJson.packages.find { it.name == "rustls-platform-verifier-android" }

    if (pkg == null) {
        throw new GradleException("rustls-platform-verifier-android package not found in cargo metadata!")
    }

    def manifestPath = file(pkg.manifest_path)
    def mavenDir = new File(manifestPath.parentFile, "maven")

    if (!mavenDir.exists()) {
        throw new GradleException("Maven directory not found at: ${mavenDir.path}")
    }

    println("✓ Found rustls-platform-verifier maven repo at: ${mavenDir.path}")
    return mavenDir.path
}


repositories {
    maven {
        url = findRustlsPlatformVerifierMavenDir()
        metadataSources.artifact()
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:3.25.5'
    }

    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}

android {
    namespace "com.camellia.remote"
    compileSdk rootProject.ext.appCompileSdk
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'

        main.proto.srcDirs += '../../../libs/camellia_remote_protocol/protos'
        main.proto.includes += "message.proto"
    }

    compileOptions {
        targetCompatibility JavaVersion.VERSION_17
        sourceCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.camellia.remote"
        minSdk 26
        targetSdk 37
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ['**/libc++_shared.so']
        }
    }

    signingConfigs {
        release {
            if (ciSigningConfigured) {
                keyAlias ciSigningValues.keyAlias
                keyPassword ciSigningValues.keyPassword
                storeFile file(ciSigningValues.storeFile)
                storePassword ciSigningValues.storePassword
            } else if (localSigningConfigured) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            if (ciSigningConfigured || localSigningConfigured) {
                signingConfig signingConfigs.release
            } else if (!formalRelease) {
                // Keep ordinary local development convenient. Formal release
                // automation never uses this unstable debug update identity.
                signingConfig signingConfigs.debug
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules'
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.protobuf:protobuf-javalite:3.25.5'
    implementation "androidx.media:media:1.6.0"
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'com.caverock:androidsvg-aar:1.4'
    implementation "rustls:rustls-platform-verifier:0.1.1"
}
