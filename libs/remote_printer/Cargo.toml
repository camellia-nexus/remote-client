[package]
name = "remote_printer"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/camellia-nexus/remote-client"
publish = false
description = "Remote printer driver and spooler integration for Camellia Remote"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[target.'cfg(target_os = "windows")'.dependencies]
camellia_remote_protocol = { package = "camellia-remote-protocol", version = "0.1.0", path = "../camellia_remote_protocol" }
winapi = { version = "0.3", features = ["winspool", "winerror", "minwindef", "ntdef"] }
windows-strings = "0.3.1"
