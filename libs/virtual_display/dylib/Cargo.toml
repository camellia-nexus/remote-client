[package]
name = "dylib_virtual_display"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/camellia-nexus/remote-client"
publish = false
description = "Virtual display dylib implementation for Camellia Remote"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
cc = "1.0"

[dependencies]
thiserror = "1.0.30"
lazy_static = "1.4"
serde = "1.0"
serde_derive = "1.0"
camellia_remote_protocol = { package = "camellia-remote-protocol", path = "../../camellia_remote_protocol" }
